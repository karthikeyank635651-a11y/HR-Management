<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h5>LOGIN</h5>

{% if form.errors %}
<p style="color:red">invalid username or password</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>
<p>if new user <a href="{% url 'signup' %}">SignUp</a></p>
</body>
</html>
